# nginx config for Cloud Run — SPA serving + CSP + security headers.
#
# Ported from the App Engine app.yaml CSP so origin allowlists stay
# consistent when the cutover happens. Tightened in two ways vs. app.yaml:
#   - connect-src no longer includes generativelanguage.googleapis.com
#     (Phase 1c routes Gemini through Supabase Edge Functions — the browser
#     should never reach Google directly anymore).
#   - script-src/style-src/img-src scoped as narrowly as the current third-
#     party surface allows. Tailwind CDN stays until Phase 3A ships a bundled
#     Tailwind build; then it can be dropped from script-src.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets. Cloud Run's frontend will also negotiate br/gzip,
    # but nginx emitting pre-compressed is cheaper than the edge doing it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Long-cache hashed assets (Vite emits content-hashed filenames).
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Secondary entry point — SmailApp's MSAL redirect target.
    location = /auth.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files /auth.html =404;
    }

    # SPA fallback — every unknown route returns index.html so React Router
    # can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Security headers — applied on the HTML response so every nav pick
        # them up. Static-asset responses above set Cache-Control + nosniff.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;

        # Content-Security-Policy — kept permissive for CDN-loaded runtime
        # (Tailwind CDN, esm.sh, aistudiocdn) and Microsoft/Google identity
        # flows. Phase 1e will tighten to nonce-based once CDN imports are
        # replaced with bundled deps.
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh https://login.microsoftonline.com https://graph.microsoft.com https://*.googleapis.com https://api.allorigins.win https://corsproxy.io https://corsproxy.org https://hall-memory-714806671182.us-central1.run.app https://shipsgo.com https://api.elevenlabs.io; frame-src 'self' blob: data: https://login.microsoftonline.com; child-src 'self' blob: data: https://login.microsoftonline.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://aistudiocdn.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: cid: https: http:;" always;
    }

    # Health check for Cloud Run (returns 200 even if index.html is missing —
    # lets the platform mark the revision healthy during cold start).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type "text/plain" always;
    }

    # Block dotfiles and common backup suffixes from being served.
    location ~ /\.(ht|git|env) { deny all; return 404; }
    location ~ ~$            { deny all; return 404; }
}
