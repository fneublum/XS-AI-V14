# ─── HERMES MCP: Supabase ERP Integration ───────────────────────────────────
# Add this block to your existing HERMES MCP tools config.
# Allows Max, Lara, Matt, Logan and any other agent to query the ERP database
# directly from WhatsApp conversations — no custom scripts needed.
#
# Install the MCP server first (on Mac mini):
#   pip install mcp-server-supabase
#   or: npx -y @supabase/mcp-server-supabase@latest (requires node)
#
# Usage example in an agent:
#   "What are the bookings with cut-off this week?"
#   → Max calls supabase_query → returns live rows from Supabase

mcp_servers:
  supabase_erp:
    command: npx
    args:
      - "-y"
      - "@supabase/mcp-server-supabase@latest"
      - "--project-ref"
      - "qfskvevighylzzmyiwre"          # XSCRM Supabase project
      - "--read-only"                    # safe: agents can read but not accidentally delete
    env:
      SUPABASE_ACCESS_TOKEN: "${SUPABASE_SERVICE_ROLE_KEY}"  # set in .env or config

# ─── Key tables agents can query ────────────────────────────────────────────
# bookings          — booking #, customer, POL/POD, ETD, cut-off dates, status
# invoices          — invoice #, customer, amount, status
# sales_orders      — SO #, customer, status, booking linkage
# bl_audits         — document audit status, issues, corrections
# customers         — customer name, email, contacts
# ports             — UN/LOCODE lookup
